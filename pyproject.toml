[project]
name = "dimred"
version = "0.1.0"
description = "Comparison of UMAP, t-SNE and autoencoders for nonlinear dimensionality reduction"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
